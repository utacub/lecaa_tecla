# Publica l'app a GitHub Pages: la versió instal·lable (dist/pwa) a l'arrel i el fitxer únic per descarregar.
name: Publica a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara el lloc
        run: |
          mkdir -p _site
          cp -r dist/pwa/. _site/
          cp dist/LECAA-Tecla.html _site/LECAA-Tecla.html
          cp -r LICENSES _site/LICENSES
          cp LICENSE _site/LICENSE.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
